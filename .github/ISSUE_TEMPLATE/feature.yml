name: "Feature Request"
description: Propose a new feature or improvement for StemHub
title: "[FEATURE] "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve StemHub 🚀
        Please provide clear details so we can evaluate and plan this feature effectively.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What is the goal of this feature? (1-2 sentences)
      placeholder: "Enable producers to compare audio between versions without leaving the DAW."
    validations:
      required: true

  - type: textarea
    id: user_story
    attributes:
      label: User Story
      description: Describe from the user's perspective
      placeholder: "As a [role], I want [capability] so that [benefit]."
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What will be included in this feature?
      placeholder: |
        - Feature component 1
        - Feature component 2
        - Feature component 3
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: What will NOT be included? (helps prevent scope creep)
      placeholder: |
        - Related feature X (deferred to later)
        - Advanced use case Y (out of MVP scope)
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: How do we know this feature is complete? (testable conditions)
      placeholder: |
        - [ ] User can perform action X
        - [ ] System responds with Y
        - [ ] Edge case Z is handled gracefully
        - [ ] Documentation is updated
        - [ ] Tests are added
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Primary Component
      description: Which part of the system is primarily affected?
      options:
        - Backend (FastAPI/Python)
        - Frontend (Next.js/React)
        - Plugin (JUCE/C++)
        - Parser (PyFLP)
        - Storage
        - Infrastructure
        - Documentation
        - Multiple Components
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size Estimate
      description: Rough effort estimate (will be refined during planning)
      options:
        - "XS (< 2 hours)"
        - "S (2-8 hours)"
        - "M (1-3 days)"
        - "L (1-2 weeks)"
        - "XL (2+ weeks - requires breakdown)"
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: What must be completed first? What does this block?
      placeholder: |
        Blocked by: #123, #456
        Blocks: #789
    validations:
      required: false

  - type: textarea
    id: success_metrics
    attributes:
      label: Success Metrics
      description: How will we measure success? (optional but encouraged)
      placeholder: |
        - 80% user adoption rate in beta
        - < 2 second load time
        - Zero P0 bugs in first week
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, references, technical notes
      placeholder: "Add any relevant context, links, or attachments."
    validations:
      required: false
