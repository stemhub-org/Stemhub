name: Notify Discord on PR

on:
  pull_request:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Discord payload
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg title "$PR_TITLE" \
            --arg author "$PR_AUTHOR" \
            --arg url "$PR_URL" \
            '{content: ("@everyone 📣 A new pull request has been opened on **" + $repository + "**!\n**Title:** " + $title + "\n**Author:** " + $author + "\n**Link:** " + $url)}' \
            > "$RUNNER_TEMP/discord-payload.json"

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/discord-payload.json" \
            "$DISCORD_WEBHOOK"
