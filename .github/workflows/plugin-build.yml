name: plugin-build

on:
  pull_request:
    paths:
      - "plugin/stemhub/**"
      - ".github/workflows/plugin-build.yml"
  push:
    branches:
      - main
    paths:
      - "plugin/stemhub/**"
      - ".github/workflows/plugin-build.yml"
  workflow_dispatch:

env:
  # Pinned so every platform and every run builds against the same JUCE.
  JUCE_VERSION: "9.0.2"

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            cmake_generator: "-G Ninja"
            plugin_targets: stemhub_VST3 stemhub_Standalone
          - name: macos
            os: macos-latest
            cmake_generator: ""
            plugin_targets: stemhub_VST3 stemhub_AU stemhub_Standalone
          - name: windows
            os: windows-latest
            cmake_generator: ""
            plugin_targets: stemhub_VST3 stemhub_Standalone
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch JUCE ${{ env.JUCE_VERSION }}
        run: git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git build/juce

      - name: Ensure Projucer-generated files are not tracked
        run: |
          test ! -e plugin/stemhub/Builds
          test ! -e plugin/stemhub/JuceLibraryCode

      - name: Install JUCE Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Configure CMake
        run: >
          cmake -S plugin/stemhub -B build/plugin ${{ matrix.cmake_generator }}
          -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN=OFF -DJUCE_DIR="$GITHUB_WORKSPACE/build/juce"

      - name: Build plugin and headless plugin tests
        # An explicit job count: without one, make (macOS) starts every compile at once.
        run: cmake --build build/plugin --config Release --parallel 4 --target ${{ matrix.plugin_targets }} stemhub_plugin_tests

      - name: Run headless plugin tests
        # Several runs: the tests exercise thread interleavings, so one pass proves little.
        run: ctest --test-dir build/plugin -C Release --output-on-failure --repeat until-fail:10

      - name: Build and run the plugin tests in Debug
        # Debug adds JUCE's leak detector and its debug-only checks.
        run: |
          cmake -S plugin/stemhub -B build/plugin-debug ${{ matrix.cmake_generator }} \
            -DCMAKE_BUILD_TYPE=Debug -DCOPY_PLUGIN=OFF -DJUCE_DIR="$GITHUB_WORKSPACE/build/juce"
          cmake --build build/plugin-debug --config Debug --parallel 4 --target stemhub_plugin_tests
          ctest --test-dir build/plugin-debug -C Debug --output-on-failure --repeat until-fail:10

      - name: Verify plugin artifacts exist
        run: |
          find build/plugin/stemhub_artefacts -maxdepth 3 -name '*.vst3' -print | grep -q .
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            find build/plugin/stemhub_artefacts -maxdepth 3 -name '*.component' -print | grep -q .
          fi
          find build/plugin/stemhub_artefacts -maxdepth 3 -path '*/Standalone/*' -print | grep -q .
