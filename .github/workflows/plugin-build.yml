name: plugin-build

on:
  pull_request:
    paths:
      - "plugin/stemhub/Source/**"
      - "plugin/stemhub/tests/**"
      - "plugin/stemhub/CMakeLists.txt"
      - ".github/workflows/plugin-build.yml"
  push:
    branches:
      - main
    paths:
      - "plugin/stemhub/Source/**"
      - "plugin/stemhub/tests/**"
      - "plugin/stemhub/CMakeLists.txt"
      - ".github/workflows/plugin-build.yml"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git build/juce

      - name: Ensure Projucer-generated files are not tracked
        run: |
          test ! -e plugin/stemhub/Builds/LinuxMakefile/Makefile
          test ! -e plugin/stemhub/JuceLibraryCode/JuceHeader.h

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            WEBKIT_PACKAGE="libwebkit2gtk-4.1-dev"
          else
            WEBKIT_PACKAGE="libwebkit2gtk-4.0-dev"
          fi
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libgtk-3-dev \
            "$WEBKIT_PACKAGE" \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Configure CMake
        run: cmake -S plugin/stemhub -B build/plugin-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN=OFF -DJUCE_DIR="$GITHUB_WORKSPACE/build/juce"

      - name: Build plugin and headless plugin tests
        run: cmake --build build/plugin-linux --target stemhub_VST3 stemhub_plugin_tests --parallel

      - name: Run headless plugin tests
        run: |
          test_bin="$(find build/plugin-linux/stemhub_plugin_tests_artefacts -type f -name 'stemhub_plugin_tests' -print -quit)"
          test -n "$test_bin"
          echo "Running plugin tests: $test_bin"
          "$test_bin"

      - name: Verify VST3 artifact exists
        run: |
          artifact="$(find build/plugin-linux/stemhub_artefacts/Release/VST3 -maxdepth 1 -type d -name '*.vst3' -print -quit)"
          test -n "$artifact"
          echo "Found VST3 artifact at: $artifact"
