name: sync-pyflp-submodule

on:
  repository_dispatch:
    types: [pyflp_upstream_push]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-submodule:
    if: github.repository == 'stemhub-org/Stemhub'
    runs-on: ubuntu-latest
    steps:
      # Submodule bumps go to dev, never to main: the pointer is updated on
      # top of dev, and the pull request below targets dev.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          submodules: recursive

      - name: Update submodule pointer
        id: update
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive
          git -C backend/vendor/PyFLP_v2 fetch origin main
          git submodule update --remote -- backend/vendor/PyFLP_v2

          if git diff --quiet -- backend/vendor/PyFLP_v2; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Keep the recorded parser commit in step with the pointer
          # (backend/tests/test_parser_version.py checks the two match).
          full_sha="$(git -C backend/vendor/PyFLP_v2 rev-parse HEAD)"
          version_file=backend/src/stemhub/parser_version.py
          sed -i -E "s/^PYFLP_COMMIT = \"[0-9a-f]{40}\"$/PYFLP_COMMIT = \"${full_sha}\"/" "$version_file"
          grep -qx "PYFLP_COMMIT = \"${full_sha}\"" "$version_file"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "new_sha=$(git -C backend/vendor/PyFLP_v2 rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump PyFLP_v2 submodule to ${{ steps.update.outputs.new_sha }}"
          title: "chore: bump PyFLP_v2 submodule (${{ steps.update.outputs.new_sha }})"
          body: |
            Automated submodule pointer update triggered by upstream push.
          branch: "chore/update-pyflp-submodule"
          base: dev
          delete-branch: true
