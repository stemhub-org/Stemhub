name: app-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

jobs:
  parser-corpus:
    name: parser-corpus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/vendor/PyFLP_v2/pyproject.toml

      - name: Install parser corpus dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/vendor/PyFLP_v2
          pip install -e "backend[dev]"

      - name: Run parser fixture corpus gate
        run: pytest backend/tests/test_parser_fixture_corpus.py

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/vendor/PyFLP_v2/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/vendor/PyFLP_v2
          pip install -e "backend[dev]"

      # The floor is the whole percentage under the total measured when it was
      # last raised (78.89% on Python 3.11 and 3.13, then 79.26% on 3.13). Raise
      # it as coverage grows, toward the 80% backend target (SPECIFICATION.md §9.1).
      - name: Run backend tests with coverage
        run: |
          pytest backend/tests \
            --cov=backend/src/stemhub \
            --cov-report=term-missing \
            --cov-report=xml:backend/coverage.xml \
            --cov-report=html:backend/htmlcov \
            --cov-fail-under=78

      # New code starts at the target: the project model package alone must
      # reach 80%. The guard skips the check on branches without the package
      # (coverage exits with "No data to report" when nothing matches).
      - name: Check project model coverage
        run: |
          if compgen -G 'backend/src/stemhub/project_model/*.py' > /dev/null; then
            coverage report \
              --include='backend/src/stemhub/project_model/*' \
              --fail-under=80
          else
            echo "::warning::backend/src/stemhub/project_model has no Python modules; skipping its coverage check"
          fi

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            backend/coverage.xml
            backend/htmlcov/
          if-no-files-found: warn

  frontend-lint:
    name: frontend-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend lint
        run: npm run lint --prefix frontend

  compose-integration:
    name: compose-integration
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
      DATABASE_URL: postgresql://ci:ci@db:5432/ci
      SECRET_KEY: ci-fixture-secret-key-not-for-any-real-deployment-0123456789
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      STEMHUB_STORAGE_PROVIDER: local
      STEMHUB_STORAGE_ROOT: /tmp/storage
      STEMHUB_GCS_BUCKET: ci
      STEMHUB_GCS_PROJECT: ci
      STEMHUB_GCS_CREDENTIALS_JSON: "{}"
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/fake-gcp.json
      NEXT_PUBLIC_API_URL: http://backend:8000
      PGADMIN_DEFAULT_EMAIL: ci@example.com
      PGADMIN_DEFAULT_PASSWORD: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The backend image installs PyFLP from backend/vendor/PyFLP_v2.
          submodules: recursive

      - name: Verify Docker Compose is available
        run: docker compose version

      - name: Build backend and frontend services
        run: docker compose build backend frontend

      - name: Start database
        run: docker compose up -d db

      - name: Wait for database readiness
        run: |
          timeout 120s bash -c 'until docker compose exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done'

      - name: Validate Alembic migrations
        run: docker compose run --rm backend alembic upgrade head

      - name: Start backend and frontend
        run: docker compose up -d --no-build backend frontend

      - name: Smoke test backend root endpoint
        run: |
          timeout 120s bash -c 'until curl -fsS http://127.0.0.1:8000/ | grep -q "Welcome to the StemHub API"; do sleep 2; done'

      - name: Smoke test frontend root endpoint
        run: |
          timeout 180s bash -c 'until curl -fsS http://127.0.0.1:3000/ | grep -qi "<html"; do sleep 2; done'

      - name: Show Docker Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
